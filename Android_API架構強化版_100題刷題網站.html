const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let selected=[],responses={},submitted=false,onlyWrong=false,mode='practice';
function randomPick(array,n){let a=array.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n).sort((a,b)=>a.id-b.id)}
function start(){const category=$('topic').value;const pool=BANK.filter(q=>category==='all'||q.category===category);selected=randomPick(pool,Math.min(Number($('amount').value),pool.length));responses={};submitted=false;onlyWrong=false;mode=$('mode').value;$('results').classList.add('hidden');$('status').classList.remove('hidden');$('footer').classList.remove('hidden');render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){const list=onlyWrong&&submitted?selected.filter(q=>responses[q.id]!==q.answer):selected;const answered=selected.filter(q=>responses[q.id]!==undefined).length;$('counter').textContent=`已作答 ${answered} / ${selected.length}`;$('bar').style.width=(answered/selected.length*100)+'%';$('currentMode').textContent=mode==='exam'?'測驗模式':'練習模式';$('foottext').textContent=submitted?'已交卷':`共 ${selected.length} 題`;$('submit').textContent=submitted?'重新顯示成績':'交卷／查看結果';$('wrongOnly').disabled=!submitted;$('showAll').disabled=!onlyWrong;$('questions').innerHTML=list.map(q=>{const chosen=responses[q.id];const reveal=submitted||(mode==='practice'&&chosen!==undefined);let options=q.options.map((o,i)=>{let className='opt';if(reveal&&i===q.answer)className+=' correct';else if(reveal&&chosen===i&&i!==q.answer)className+=' wrong';return `<label class="${className}"><input type="radio" name="q${q.id}" value="${i}" ${chosen===i?'checked':''} ${submitted?'disabled':''}><span>${'ABCD'[i]}. ${esc(o)}</span></label>`}).join('');return `<article class="question" id="q${q.id}"><div class="row"><span class="tag">第 ${q.id} 題</span><span class="small">${esc(q.category)}${q.id>=21&&q.id<=23?' · 比賽概論':''}</span></div><h3>${esc(q.question)}</h3>${options}${reveal?`<div class="feedback ${chosen!==q.answer?'bad':''}">正解：${'ABCD'[q.answer]} · ${esc(q.options[q.answer])}</div>`:''}</article>`}).join('')||'<div class="toolbar">本次沒有錯題。</div>';
for(const input of document.querySelectorAll('#questions input'))input.addEventListener('change',e=>{responses[Number(e.target.name.slice(1))]=Number(e.target.value);if(mode==='practice'){const y=window.scrollY;render();window.scrollTo(0,y)}else{updateProgress()}})}
function updateProgress(){const answered=selected.filter(q=>responses[q.id]!==undefined).length;$('counter').textContent=`已作答 ${answered} / ${selected.length}`;$('bar').style.width=answered/selected.length*100+'%'}
function finish(){if(!submitted){const missing=selected.length-Object.keys(responses).length;if(missing&&!confirm(`還有 ${missing} 題未作答，確定交卷嗎？`))return;submitted=true;}let right=selected.filter(q=>responses[q.id]===q.answer).length;let score=selected.length?Math.round(right/selected.length*100):0;$('results').innerHTML=`<h2>本次測驗結果</h2><div class="score">${score} 分</div><p>答對 ${right} / ${selected.length} 題；答錯或未答 ${selected.length-right} 題。</p><p class="small">可使用「只看本次錯題」複習；本網站不收集或上傳作答紀錄。</p>`;$('results').classList.remove('hidden');onlyWrong=false;render();$('results').scrollIntoView({behavior:'smooth',block:'center'})}
$('start').onclick=start;$('submit').onclick=finish;$('wrongOnly').onclick=()=>{onlyWrong=true;render()};$('showAll').onclick=()=>{onlyWrong=false;render()};start();
</script></body></html>
